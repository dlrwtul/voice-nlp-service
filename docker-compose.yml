services:
  voice-nlp:
    build: .
    ports:
      - "8100:8000"
    env_file: .env
    depends_on:
      - ollama
    volumes:
      - whisper-cache:/root/.cache/whisper
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  whisper-cache:
  ollama-data:
